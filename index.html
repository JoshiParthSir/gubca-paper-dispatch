  <head>

    <link rel="dns-prefetch" href="https://wjmtfmnrygsxriqdmnmj.supabase.co" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="Paper Dispatch · Secure Exam Paper Delivery" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Boot splash styles: inline so the loader paints before any JS/CSS loads.
         The exit (curtain lift) is triggered by src/components/AppLoader.tsx. -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(900px 520px at 50% 38%, #0a4f99 0%, transparent 62%),
          radial-gradient(700px 500px at 100% 100%, #001a33 0%, transparent 60%),
          #003366;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        will-change: transform;
      }
      #boot-splash .bs-stage { display: flex; flex-direction: column; align-items: center; }
      #boot-splash .bs-glow {
        position: absolute; width: 360px; height: 360px; border-radius: 50%;
        background: radial-gradient(circle, rgba(253,185,19,.22) 0%, rgba(253,185,19,0) 65%);
        top: 50%; left: 50%; transform: translate(-50%, -62%);
        animation: bs-breathe 3.2s ease-in-out infinite;
      }
      #boot-splash .bs-tile {
        position: relative; width: 76px; height: 76px; border-radius: 22px;
        display: grid; place-items: center; overflow: hidden;
        background: linear-gradient(180deg, #fdb913, #e5a000);
        color: #002244;
        box-shadow: 0 24px 50px -18px rgba(229,160,0,.75), inset 0 1px 0 rgba(255,255,255,.4);
        animation: bs-tile-in .9s cubic-bezier(.22,1,.36,1) both;
      }
      #boot-splash .bs-tile svg { width: 38px; height: 38px; animation: bs-icon-in .7s .35s cubic-bezier(.22,1,.36,1) both; }
      #boot-splash .bs-tile::after {
        content: ""; position: absolute; inset: -40%;
        background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.65) 50%, transparent 60%);
        transform: translateX(-120%);
        animation: bs-sweep 1.1s .75s cubic-bezier(.4,0,.2,1) both;
      }
      #boot-splash .bs-word {
        margin-top: 26px; display: flex; font-size: 40px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1;
      }
      #boot-splash .bs-mask { display: inline-block; overflow: hidden; padding-bottom: 4px; }
      #boot-splash .bs-mask > span { display: inline-block; animation: bs-rise .9s cubic-bezier(.22,1,.36,1) both; }
      #boot-splash .bs-mask:nth-child(1) > span { animation-delay: .45s; }
      #boot-splash .bs-mask:nth-child(2) > span { animation-delay: .58s; color: #fdb913; }
      #boot-splash .bs-tag {
        margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase;
        color: rgba(255,255,255,.6); animation: bs-fade .8s .9s ease both;
      }
      #boot-splash .bs-bar {
        position: relative; margin-top: 34px; width: 180px; height: 2px; border-radius: 2px;
        background: rgba(255,255,255,.14); overflow: hidden; animation: bs-fade .6s .6s ease both;
      }
      #boot-splash .bs-bar > i {
        position: absolute; inset: 0; transform-origin: left; transform: scaleX(0);
        background: linear-gradient(90deg, #e5a000, #fdb913, #ffe08a);
        animation: bs-load 1.6s .7s cubic-bezier(.65,0,.35,1) forwards;
      }
      #boot-splash .bs-bar > b {
        position: absolute; top: 0; bottom: 0; width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
        animation: bs-shimmer 1.4s 2.3s ease-in-out infinite;
        transform: translateX(-120%);
      }
      /* Exit: content lifts and fades, then the whole panel rises like a curtain */
      #boot-splash.is-exiting .bs-stage { animation: bs-out .5s cubic-bezier(.4,0,1,1) forwards; }
      #boot-splash.is-exiting {
        animation: bs-curtain .85s .35s cubic-bezier(.76,0,.24,1) forwards;
        box-shadow: 0 4px 0 0 #fdb913;
      }

      @keyframes bs-tile-in { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes bs-icon-in { from { opacity: 0; transform: translateY(8px) scale(.85); } to { opacity: 1; transform: none; } }
      @keyframes bs-sweep { to { transform: translateX(120%); } }
      @keyframes bs-rise { from { transform: translateY(105%); } to { transform: none; } }
      @keyframes bs-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes bs-load { to { transform: scaleX(1); } }
      @keyframes bs-shimmer { to { transform: translateX(260%); } }
      @keyframes bs-breathe { 0%,100% { opacity: .65; transform: translate(-50%,-62%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-62%) scale(1.08); } }
      @keyframes bs-out { to { opacity: 0; transform: translateY(-18px) scale(.97); } }
      @keyframes bs-curtain { to { transform: translateY(-100%); } }

      @media (max-width: 480px) {
        #boot-splash .bs-word { font-size: 32px; }
        #boot-splash .bs-tile { width: 64px; height: 64px; border-radius: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash *, #boot-splash *::after { animation-duration: .01ms !important; animation-delay: 0s !important; }
        #boot-splash.is-exiting { animation: bs-fade-out .3s ease forwards; box-shadow: none; }
        @keyframes bs-fade-out { to { opacity: 0; } }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" role="status" aria-label="Loading Paper Dispatch">
      <div class="bs-glow"></div>
      <div class="bs-stage">
        <div class="bs-tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v1" />
            <path d="M14 2v4a2 2 0 0 0 2 2h4" />
            <rect width="8" height="5" x="2" y="13" rx="1" />
            <path d="M8 13v-2a2 2 0 1 0-4 0v2" />
          </svg>
        </div>
        <div class="bs-word">
          <span class="bs-mask"><span>Paper</span></span>
          <span class="bs-mask"><span>Dispatch</span></span>
        </div>
        <div class="bs-tag">Secure exam delivery</div>
        <div class="bs-bar"><i></i><b></b></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
